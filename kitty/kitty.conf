# Font
font_family JetBrainsMono Nerd Font Mono
font_size 11.5
symbol_map U+3000-U+30FF,U+4E00-U+9FFF,U+FF00-U+FFEF Noto Sans Mono CJK JP
symbol_map U+0400-U+04FF Noto Sans Mono
# Gruvbox glass appearance
background_opacity 0.93
window_padding_width 10
hide_window_decorations yes

# Cursor
cursor_shape block
cursor_blink_interval 0

# Performance and scrolling
scrollback_lines 10000
wheel_scroll_multiplier 3.0
enable_audio_bell no

# Tabs
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
active_tab_font_style bold
inactive_tab_font_style normal

# Dynamic Matugen colors (keep this last)
include matugen.conf
include themes/noctalia.conf
